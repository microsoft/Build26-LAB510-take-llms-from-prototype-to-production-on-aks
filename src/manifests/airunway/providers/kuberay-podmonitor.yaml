# PodMonitor for KubeRay inference pods
#
# KubeRay deploys a RayService with head and worker pods. vLLM runs on the
# worker nodes and exposes metrics via the Ray metrics port (8080). The head
# pod exports Ray system metrics on the same port but does not serve vLLM
# metrics.
#
# When running inside Ray Serve, vLLM metrics use a "ray_vllm_" prefix
# instead of the standalone "vllm:" prefix. For example:
#   ray_vllm_num_requests_running, ray_vllm_time_to_first_token_seconds, etc.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kuberay-inference-metrics
  namespace: kuberay-system
  labels:
    release: prometheus
    app.kubernetes.io/part-of: airunway
spec:
  selector:
    matchExpressions:
      - key: airunway.ai/model-deployment
        operator: Exists
      - key: ray.io/node-type
        operator: In
        values: ["worker"]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - action: replace
          sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - action: replace
          targetLabel: provider
          replacement: kuberay
  namespaceSelector:
    any: true